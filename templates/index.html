<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中音薩克斯風演奏練習程式 - 含譜面顯示、節奏引導與多音軌伴奏">
  <title>中音薩克斯風演奏練習</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header id="app-header">
    <h1>中音薩克斯風演奏練習</h1>
  </header>

  <main id="app-main">
    <!-- 曲目清單區 -->
    <section id="song-list-section">
      <h2>曲目清單</h2>
      <div id="song-list" class="song-list">
        <!-- 由 JavaScript 動態產生 -->
      </div>
    </section>

    <!-- 練習頁區(預設隱藏) -->
    <section id="practice-section" style="display: none;">
      <div id="practice-header">
        <button id="btn-back" type="button">返回清單</button>
        <h2 id="practice-title"></h2>
      </div>

      <!-- 預備拍大字倒數 Overlay -->
      <div id="countin-overlay" class="countin-overlay" style="display: none;">
        <span id="countin-number" class="countin-number">4</span>
      </div>

      <!-- VexFlow 譜面繪製區 -->
      <div id="score-container" class="score-wrapper">
        <!-- 由 VexFlow 動態渲染 -->
      </div>

      <!-- 播放控制列 -->
      <div id="controls" class="controls-panel">
        <div class="control-group buttons-group">
          <button id="btn-play" class="btn-control btn-play" type="button">播放</button>
          <button id="btn-pause" class="btn-control btn-pause" type="button" disabled>暫停</button>
          <button id="btn-stop" class="btn-control btn-stop" type="button" disabled>停止</button>
        </div>

        <div class="control-group tempo-group">
          <label for="tempo-slider">播放速度:</label>
          <input id="tempo-slider" type="range" min="0.5" max="1.2" step="0.05" value="1.0">
          <span id="tempo-display">100% (120 BPM)</span>
        </div>

        <div class="control-group loop-group">
          <label class="checkbox-label">
            <input id="loop-enable" type="checkbox">
            啟用小節循環
          </label>
          <label for="loop-start">從第</label>
          <select id="loop-start" disabled></select>
          <label for="loop-end">至第</label>
          <select id="loop-end" disabled></select>
          <span>小節</span>
        </div>
      </div>

      <div id="track-panel">
        <!-- 階段 4 音軌面板預留 -->
      </div>
    </section>
  </main>

  <footer id="app-footer">
    <p>sax-play-along -- 中音薩克斯風演奏練習</p>
  </footer>

  <script src="/static/vendor/vexflow.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
